networks:
  default:
    ipam:
      config:
        - subnet: 192.168.10.0/24

services:
  mirakurun:
    image: mirakurun
    container_name: Mirakurun
    build:
      context: ./mirakurun
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    ports:
      - "40772:40772"
      - "9229:9229"
    volumes:
      - ./mirakurun/conf:/app-config
      - ./mirakurun/data:/app-data
    environment:
      TZ: "Asia/Tokyo"
    devices:
      - /dev/bus:/dev/bus
      - /dev/px4video0:/dev/px4video0
      - /dev/px4video1:/dev/px4video1
      - /dev/px4video2:/dev/px4video2
      - /dev/px4video3:/dev/px4video3
    restart: always
    logging:
      driver: json-file
      options:
        max-file: "1"
        max-size: 10m

  mirakurun_init:
    image: mirakurun
    container_name: Mirakurun_init_container
    build:
      context: ./mirakurun
    depends_on:
      mirakurun:
        condition: service_started
    network_mode: host
    command: [ "sh", "-c", "until wget -nv --spider http://localhost:40772/api/status; do sleep 3; done" ]

  edcb_chscan:
    image: edcb
    container_name: EDCB_ChScan
    build:
      context: ./EDCB
    depends_on:
      mirakurun_init:
        condition: service_completed_successfully
    network_mode: host
    volumes:
      - type: bind
        source: "./EDCB/edcb/Common.ini"
        target: "/var/local/edcb/Common.ini"
      - type: bind
        source: "./EDCB/edcb/EpgDataCap_Bon.ini"
        target: "/var/local/edcb/EpgDataCap_Bon.ini"
      - type: bind
        source: "./EDCB/edcb/EpgTimerSrv.ini"
        target: "/var/local/edcb/EpgTimerSrv.ini"
      - type: bind
        source: "./EDCB/edcb/Setting"
        target: "/var/local/edcb/Setting"

  edcb:
    image: edcb
    container_name: EDCB
    build:
      context: ./EDCB
    depends_on:
      mirakurun_init:
        condition: service_completed_successfully
      edcb_chscan:
        condition: service_completed_successfully
    restart: always
    network_mode: host
    command: /usr/local/bin/EpgTimerSrv
    volumes:
      - type: bind
        source: "./EDCB/edcb/Common.ini"
        target: "/var/local/edcb/Common.ini"
      - type: bind
        source: "./EDCB/edcb/EpgDataCap_Bon.ini"
        target: "/var/local/edcb/EpgDataCap_Bon.ini"
      - type: bind
        source: "./EDCB/edcb/EpgTimerSrv.ini"
        target: "/var/local/edcb/EpgTimerSrv.ini"
      - type: bind
        source: "./EDCB/edcb/Setting"
        target: "/var/local/edcb/Setting"
      - type: bind
        source: "./EDCB/record"
        target: "/record"

  konomitv:
    image: konomitv
    container_name: KonomiTV
    build:
      context: ./KonomiTV
    depends_on:
      mirakurun_init:
        condition: service_completed_successfully
      edcb:
        condition: service_started
    restart: always
    network_mode: host
    volumes:
      - type: bind
        source: './KonomiTV/config.yaml'
        target: '/code/config.yaml'
      - type: bind
        source: './KonomiTV/server/data/'
        target: '/code/server/data/'
      - type: bind
        source: './KonomiTV/server/logs/'
        target: '/code/server/logs/'
      - type: bind
        source: '/'
        target: '/host-rootfs/'
    devices:
      # Intel iGPU (UHD P630) のレンダーノードだけを渡す。Quadro (nouveau) は渡さない
      # PCI アドレスは `ls -l /dev/dri/by-path/` で確認 (Intel iGPU は通常 0000:00:02.0)
      # パスに ":" が入るので長い書き方にする
      - source: /dev/dri/by-path/pci-0000:00:02.0-render
        target: /dev/dri/renderD128
        permissions: rwm
    # KonomiTV で NVEncC を使うときはコメントを外す (ホストに NVIDIA ドライバと NVIDIA Container Toolkit が必要)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [compute, utility, video]   # KonomiTV 公式の docker-compose.example.yaml と同じ

  epgstation_db:
    image: mariadb:12.3
    container_name: EPGStation_DB
    # ホストのユーザーとして動かし、./EPGStation/db のファイルの所有者をホストのユーザーにする
    # UID / GID が 1000 以外なら書き換える (`id -u` / `id -g` で確認)
    user: "1000:1000"
    restart: always
    # compose のネットワーク内だけで使う (ホストには公開しない)
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance_schema=OFF
      --expire_logs_days=1
    environment:
      MYSQL_USER: epgstation
      MYSQL_PASSWORD: epgstation
      MYSQL_ROOT_PASSWORD: epgstation
      MYSQL_DATABASE: epgstation
      TZ: "Asia/Tokyo"
    volumes:
      - ./EPGStation/db:/var/lib/mysql

  epgstation:
    image: epgstation
    container_name: EPGStation
    # ホストのユーザーとして動かし、録画ファイル・サムネイル・ログの所有者をホストのユーザーにする
    # UID / GID が 1000 以外なら書き換える (`id -u` / `id -g` で確認)
    user: "1000:1000"
    build:
      context: ./EPGStation
    depends_on:
      mirakurun_init:
        condition: service_completed_successfully
      epgstation_db:
        condition: service_started
    restart: always
    ports:
      - "8888:8888"   # http://<ホスト>:8888/ (Socket.IO も同じポート)
    environment:
      TZ: "Asia/Tokyo"
    volumes:
      - ./EPGStation/config/config.yml:/app/config/config.yml
      - ./EPGStation/config/tsreplace.sh:/app/config/tsreplace.sh:ro
      - ./EPGStation/data:/app/data
      - ./EPGStation/thumbnail:/app/thumbnail
      - ./EPGStation/logs:/app/logs
      - ./EPGStation/recorded:/recorded   # ts/ と encoded/ を作る
    logging:
      driver: json-file
      options:
        max-file: "1"
        max-size: 10m
